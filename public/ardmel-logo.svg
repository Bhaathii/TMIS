<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <!-- Background -->
  <rect width="600" height="160" fill="white"/>
  
  <!-- Main Text "ARDMEL" -->
  <text x="20" y="85" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="#001b42" letter-spacing="3">ARDMEL</text>
  
  <!-- Blue swoosh/wave line below ARDMEL -->
  <path d="M 10 100 Q 150 95, 300 105 L 320 95 L 300 115 Q 150 105, 15 110 Z" fill="#0066ff" />
  <path d="M 300 105 L 350 80 L 320 110 Z" fill="#0066ff"/>
  
  <!-- Dark navy triangle accent -->
  <polygon points="320,110 370,90 350,115" fill="#001b42"/>
  
  <!-- Gray accent line -->
  <line x1="320" y1="105" x2="480" y2="115" stroke="#999999" stroke-width="8"/>
  
  <!-- Tagline "A world of performance" -->
  <text x="20" y="130" font-family="Arial, Helvetica, sans-serif" font-size="16" font-style="italic" fill="#001b42" letter-spacing="1">A world of performance</text>
</svg>